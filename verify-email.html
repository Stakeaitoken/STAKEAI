<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="STAKEAI hesap e-postanızı doğrulayın.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0e11">
    <title>E-posta doğrulama — STAKEAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex flex-col">
    <header class="border-b border-gray-800 px-4 py-4">
        <a href="/" class="mx-auto flex max-w-5xl items-center gap-3">
            <img src="stakeai-logo.svg" alt="STAKEAI" class="h-10 w-10">
            <span class="text-xl font-bold tracking-wide text-white">STAKE<span class="text-emerald-300">AI</span></span>
        </a>
    </header>
    <main class="grid flex-1 place-items-center p-4">
        <section class="w-full max-w-lg rounded-2xl border border-gray-800 bg-gray-900 p-8 text-center shadow-2xl">
            <div id="verifyIcon" class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full border border-emerald-400/30 bg-emerald-400/10 text-4xl text-emerald-300" aria-hidden="true">…</div>
            <h1 id="verifyTitle" class="text-2xl font-bold">Verifying your email</h1>
            <p id="verifyStatus" role="status" aria-live="polite" class="mt-4 text-gray-300">Please wait…</p>
            <a id="loginLink" href="/?auth=login" class="mt-6 inline-block w-full rounded-xl bg-emerald-400 px-5 py-3 font-semibold text-gray-950 transition hover:bg-emerald-300">Return to STAKEAI</a>
        </section>
    </main>
    <script src="verify-email.js"></script>
</body>
</html>
