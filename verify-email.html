<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Verify your STAKEAI account email address.">
    <meta name="theme-color" content="#0b0e11">
    <title>Verify email — STAKEAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 grid place-items-center p-4">
    <main class="w-full max-w-lg rounded-2xl border border-gray-800 bg-gray-900 p-8 text-center">
        <img src="stakeai-logo.svg" alt="STAKEAI" class="mx-auto mb-5 h-16 w-16">
        <h1 id="verifyTitle" class="text-2xl font-bold">Verifying your email</h1>
        <p id="verifyStatus" role="status" aria-live="polite" class="mt-4 text-gray-300">Please wait…</p>
        <a id="loginLink" href="/" class="mt-6 inline-block rounded-lg bg-emerald-400 px-5 py-3 font-semibold text-gray-950">Return to STAKEAI</a>
    </main>
    <script src="verify-email.js"></script>
</body>
</html>
